name: Product API CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  ci:
    name: Test Product API

    runs-on: ubuntu-latest


    services:

      mongodb:

        image: mongo:8.0

        ports:
          - 27017:27017

        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    env:

      PORT: 3000

      MONGODB_URI: mongodb://127.0.0.1:27017/productdb_ci


    steps:

      - name: Checkout source code
        uses: actions/checkout@v6


      - name: Setup Node.js
        uses: actions/setup-node@v7

        with:
          node-version: 24
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Run CRUD tests
        run: npm test


      - name: Start Product API
        run: |
          npm start &
          echo $! > api.pid


      - name: Wait for Product API
        run: |
          for i in {1..30}; do

            if curl -f http://127.0.0.1:3000/health; then

              echo "Product API is healthy"

              exit 0

            fi

            sleep 2

          done

          echo "Product API healthcheck failed"

          exit 1


      - name: Test Docker build
        run: docker build -t product-api:ci .